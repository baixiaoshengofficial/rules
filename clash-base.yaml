# Native providers preserve AND / DOMAIN-REGEX through Subconverter.
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies: []
proxy-groups: []
rule-providers:
  hongguo-ad:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/baixiaoshengofficial/rules/main/HongGuoAD.list
    path: ./ruleset/hongguo-ad.list
    interval: 86400
  quic:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/baixiaoshengofficial/rules/main/block_quic.list
    path: ./ruleset/quic.list
    interval: 86400
  ai:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/baixiaoshengofficial/rules/main/AI.list
    path: ./ruleset/ai.list
    interval: 86400
  tiktok:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/baixiaoshengofficial/rules/main/TikTok.list
    path: ./ruleset/tiktok.list
    interval: 86400
rules: []
