custom_proxy_group=🔯 SG故转`fallback`(?i)(新加坡|狮城|(^|[^A-Za-z])SG([^A-Za-z]|$)|sgoracle$)`http://cp.cloudflare.com/generate_204`300
custom_proxy_group=🇭🇰 香港均衡`load-balance`(?i)(香港|(^|[^A-Za-z])HK([^A-Za-z]|$)|hkl$)`http://cp.cloudflare.com/generate_204`300
custom_proxy_group=🇯🇵 日本均衡`load-balance`(?i)(日本|(^|[^A-Za-z])JP([^A-Za-z]|$)|jpl$)`http://cp.cloudflare.com/generate_204`300
custom_proxy_group=🇭🇰 TW均衡`load-balance`(?i)(台湾|台灣|(^|[^A-Za-z])TW([^A-Za-z]|$)|twl$)`http://cp.cloudflare.com/generate_204`300
