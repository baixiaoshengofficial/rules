[custom]
; Mihomo 专用：原生 classical/text providers 保留逻辑和正则规则。
clash_rule_base=https://raw.githubusercontent.com/baixiaoshengofficial/rules/main/clash-base.yaml
; 保留原始国旗，避免仅用国旗标注地区的节点在筛选前丢失地区信息。
add_emoji=false
remove_old_emoji=false
; 优先级：局域网 → 红果 → QUIC → AI/TikTok → 白名单 → 广告 → 下载 → 服务 → 国内 → 兜底。
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=红果广告,[]RULE-SET,hongguo-ad
ruleset=♻️ Speedtest,[]DOMAIN-SUFFIX,fast.com
ruleset=🛑 QUIC,[]RULE-SET,quic
ruleset=🤖 AI,[]RULE-SET,ai
ruleset=🎵 TikTok,[]RULE-SET,tiktok
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,ddxq.mobi
; 时间同步例外必须先于 Apple / Microsoft 的整站规则。
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,time.apple.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,time.asia.apple.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,time.windows.com
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛡️ 隐私防护,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyPrivacy.list
ruleset=📦 下载节点,https://raw.githubusercontent.com/baixiaoshengofficial/rules/main/Download.list
; IPTV 精确主机优先于通用地区、国内媒体和 GEOIP；局域网规则仍最先匹配。
ruleset=🎯 全球直连,https://raw.githubusercontent.com/baixiaoshengofficial/rules/main/IPTV-Direct.list
ruleset=🇯🇵 日本节点,https://raw.githubusercontent.com/baixiaoshengofficial/rules/main/JpMandatory.list
