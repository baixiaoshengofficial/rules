type = "select"
rule = ["[]REJECT"]

[[custom_groups]]
name = "🛑 QUIC"
type = "select"
rule = ["[]REJECT", "[]🚀 节点选择", "[]DIRECT"]

[[custom_groups]]
name = "🐟 漏网之鱼"
type = "select"
rule = ["[]🚀 节点选择", "[]🇭🇰 香港节点", "[]🇭🇰 台湾节点", "[]🇯🇵 日本节点", "[]🇸🇬 新加坡节点", "[]🇺🇲 美国节点", "[]🌐 其他地区", "[]🏡 家宽节点", "[]🐸 手动切换", "[]DIRECT"]

# --- 地区自动筛选组 ---

[[custom_groups]]
name = "🏡 家宽节点"
type = "select"
rule = ["(?i)(HGC|家宽|Alice|home)"]

[[custom_groups]]
name = "🇭🇰 香港节点"
type = "select"
rule = ["(?i)(^HK|香港)"]

[[custom_groups]]
name = "🇭🇰 台湾节点"
type = "select"
rule = ["(?i)(^TW|台湾|Alice)"]

[[custom_groups]]
name = "🇯🇵 日本节点"
type = "select"
rule = ["(?i)(^JP|日本)"]

[[custom_groups]]
name = "🇸🇬 新加坡节点"
type = "select"
rule = ["(?i)(新加坡|坡|狮城|^SG)"]

[[custom_groups]]
name = "🇺🇲 美国节点"
type = "select"
rule = ["(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|^US|United States)"]

[[custom_groups]]
name = "🌐 其他地区"
type = "select"
rule = ["(?i)(^CA|^DE|^HE)"]

# --- 故障转移与负载均衡 ---

[[custom_groups]]
name = "🔯 香港故转"
type = "fallback"
rule = ["(?i)(^HK|香港)"]
url = "http://www.gstatic.com/generate_204"
interval = 300

[[custom_groups]]
name = "🔯 日本故转"
type = "fallback"
rule = ["(?i)(^JP|日本)"]
url = "http://www.gstatic.com/generate_204"
interval = 300

[[custom_groups]]
name = "🔯 SG故转"
type = "fallback"
rule = ["(?i)(新加坡|坡|狮城|^SG)"]
url = "http://www.gstatic.com/generate_204"
interval = 300

[[custom_groups]]
name = "🇭🇰 香港均衡"
type = "load-balance"
rule = ["(?i)(hkl$)"]
url = "http://www.gstatic.com/generate_204"
interval = 300
strategy = "round-robin"

[[custom_groups]]
name = "🇯🇵 日本均衡"
type = "load-balance"
rule = ["(?i)(jpl$)"]
url = "http://www.gstatic.com/generate_204"
interval = 300
strategy = "round-robin"

[[custom_groups]]
name = "🇭🇰 TW均衡"
type = "load-balance"
rule = ["(?i)(twl$)"]
url = "http://www.gstatic.com/generate_204"
interval = 300
strategy = "round-robin"

[[custom_groups]]
name = "🇸🇬 SG均衡"
type = "load-balance"
rule = ["(?i)(sgoracle$)"]
url = "http://www.gstatic.com/generate_204"
interval = 300
strategy = "round-robin"

[[custom_groups]]
name = "🎥 奈飞节点"
type = "select"
rule = ["(?i)(jpl$|twl$|hkl$)"]

