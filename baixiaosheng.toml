# ==========================================================
# Subconverter 自定义配置文件 (pref.toml 格式)
# ==========================================================

[common]
# 这里的基本设置根据您的服务器环境自行调整
api_mode = false
default_url = []

# ----------------------------------------------------------
# 策略组定义 (Custom Groups)
# ----------------------------------------------------------

[[custom_groups]]
name = "🐸 手动切换"
type = "select"
rule = [".*"]

[[custom_groups]]
name = "🚀 节点选择"
type = "select"
rule = ["[]🐸 手动切换", "[]🇭🇰 香港节点", "[]🇭🇰 台湾节点", "[]🇯🇵 日本节点", "[]🇸🇬 新加坡节点", "[]🇺🇲 美国节点", "[]🌐 其他地区", "[]🏡 家宽节点", "[]🇭🇰 香港均衡", "[]🇯🇵 日本均衡", "[]🇭🇰 TW均衡", "[]🇸🇬 SG均衡", "[]DIRECT"]

[[custom_groups]]
name = "🧱 NAS"
type = "select"
rule = ["[]DIRECT", "[]🚀 节点选择", "[]🐸 手动切换"]

[[custom_groups]]
name = "🤖 AI"
type = "select"
rule = ["[]🚀 节点选择", "[]🇭🇰 香港节点", "[]🇭🇰 台湾节点", "[]🇯🇵 日本节点", "[]🇸🇬 新加坡节点", "[]🇺🇲 美国节点", "[]🌐 其他地区", "[]🏡 家宽节点", "[]🐸 手动切换", "[]DIRECT"]

[[custom_groups]]
name = "🪟 Microsoft"
type = "select"
rule = ["[]🚀 节点选择", "[]🇭🇰 香港节点", "[]🇭🇰 台湾节点", "[]🇯🇵 日本节点", "[]🇸🇬 新加坡节点", "[]🇺🇲 美国节点", "[]🌐 其他地区", "[]🏡 家宽节点", "[]🐸 手动切换", "[]DIRECT"]

[[custom_groups]]
name = "🍎 Apple"
type = "select"
rule = ["[]🚀 节点选择", "[]🇭🇰 香港节点", "[]🇭🇰 台湾节点", "[]🇯🇵 日本节点", "[]🇸🇬 新加坡节点", "[]🇺🇲 美国节点", "[]🌐 其他地区", "[]🏡 家宽节点", "[]🐸 手动切换", "[]DIRECT"]

[[custom_groups]]
