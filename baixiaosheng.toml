rule = ["[]🎥 奈飞节点", "[]🚀 节点选择", "[]DIRECT"]

[[custom_groups]]
name = "🎮 游戏"
type = "select"
rule = ["[]🚀 节点选择", "[]🇭🇰 香港节点", "[]🇭🇰 台湾节点", "[]🇯🇵 日本节点", "[]🇸🇬 新加坡节点", "[]🇺🇲 美国节点", "[]🌐 其他地区", "[]🏡 家宽节点", "[]🐸 手动切换", "[]DIRECT"]

[[custom_groups]]
